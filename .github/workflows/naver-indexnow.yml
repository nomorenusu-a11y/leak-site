name: Notify Naver of published pages

on:
  schedule:
    - cron: "17 */2 * * *"
  workflow_dispatch:
    inputs:
      all:
        description: Submit every public sitemap URL once
        required: false
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: naver-indexnow
  cancel-in-progress: false

jobs:
  notify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Notify Naver IndexNow
        env:
          SITE_URL: https://nomorenusu.com
          SUBMIT_ALL: ${{ github.event_name == 'workflow_dispatch' && inputs.all && '1' || '0' }}
        run: node scripts/submit-naver-indexnow.mjs
