<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" role="img" aria-label="시공 사례 이미지 준비 중">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0060ad"/>
      <stop offset="1" stop-color="#003e72"/>
    </linearGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="1" cy="1" r="1" fill="#ffffff" fill-opacity="0.06"/>
    </pattern>
  </defs>
  <rect width="800" height="600" fill="url(#bg)"/>
  <rect width="800" height="600" fill="url(#dots)"/>
  <!-- droplet centered -->
  <g transform="translate(400 240)">
    <path d="M0 -80 C 40 -20 80 30 80 70 C 80 110 40 140 0 140 C -40 140 -80 110 -80 70 C -80 30 -40 -20 0 -80 Z"
          fill="#ffffff" fill-opacity="0.92"/>
    <path d="M-25 50 C -10 80 30 80 30 50" stroke="#0060ad" stroke-width="6" stroke-linecap="round" fill="none"/>
  </g>
  <text x="400" y="430" text-anchor="middle"
        font-family="'Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="36" font-weight="800" fill="#ffffff">
    시공 사례
  </text>
  <text x="400" y="475" text-anchor="middle"
        font-family="'Pretendard Variable','Apple SD Gothic Neo','Noto Sans KR',sans-serif"
        font-size="18" font-weight="600" fill="#ffffff" fill-opacity="0.85">
    실제 시공 사진은 곧 업데이트됩니다
  </text>
</svg>
